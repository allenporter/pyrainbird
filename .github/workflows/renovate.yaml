---
name: Renovate Config

on:
  push:
    branches:
      - main
      - renovate/**
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate.yaml
  pull_request:
    branches:
      - main
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate.yaml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-renovate-validator-${{ hashFiles('.github/workflows/renovate.yaml') }}
          restore-keys: |
            ${{ runner.os }}-renovate-validator-
      - name: Validate Renovate configuration
        run: |
          npx --yes --package=renovate@44 -- renovate-config-validator .github/renovate.json5
