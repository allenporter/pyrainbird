components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the OAuth 2.0 / OIDC Bearer access token retrieved from the IdentityServer.
    OAuth2AuthorizationCode:
      type: oauth2
      description: OpenID Connect Authorization Code Flow with PKCE (used by Communication Device clients).
      flows:
        authorizationCode:
          authorizationUrl: https://iq4server.rainbird.com/coreidentityserver/connect/authorize
          tokenUrl: https://iq4server.rainbird.com/coreidentityserver/connect/token
          refreshUrl: https://iq4server.rainbird.com/coreidentityserver/connect/token
          scopes:
            openid: OpenID Connect identity tokens
            coreAPI.read: Read access to Rain Bird core cloud APIs
            coreAPI.write: Write and control access to Rain Bird core cloud APIs
            profile: User profile access
            offline_access: Offline access for refresh tokens
    OAuth2Implicit:
      type: oauth2
      description: OpenID Connect Implicit Grant authentication via Rain Bird CoreIdentityServer (legacy web portal).
      flows:
        implicit:
          authorizationUrl: https://iq4server.rainbird.com/coreidentityserver/connect/authorize
          scopes:
            coreAPI.read: Read access to Rain Bird core cloud APIs
            coreAPI.write: Write and control access to Rain Bird core cloud APIs
            openid: OpenID Connect identity tokens
            profile: User profile access
