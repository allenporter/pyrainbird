---
openapi: 3.1.0
info:
  title: Rain Bird Communication Device Cloud REST API
  description: >
    OpenAPI 3.1 specification of the Rain Bird IQ4 Cloud REST API
    for connected communication devices and irrigation controllers.
  version: 2.0.0
  contact:
    name: pyrainbird Developers
    url: https://github.com/allenporter/pyrainbird
servers:
  - url: https://iq4server.rainbird.com/coreapi/api
    description: Production Rain Bird Cloud API Gateway
  - url: https://iq4server.rainbird.com/coreidentityserver
    description: Production OIDC IdentityServer Authentication Authority

security:
  - BearerAuth: []

tags:
  - name: Satellites
    description: Controller hardware lifecycle, configuration, connectivity, and firmware
  - name: Stations
    description: Irrigation zones, master valves, cycle & soak settings, pumps, and sensors
  - name: Programs
    description: Schedules, watering days, seasonal adjustments, and start times
  - name: Manual Operations
    description: Zone activation, test programs, learned flow calibration, and 2-wire diagnostics
  - name: Sensors & Flow
    description: Flow sensors, flow zones, and threshold monitoring
  - name: Sites
    description: Site grouping, addresses, coordinates, and seasonal scaling
  - name: Weather
    description: Weather data, forecasts, ET measurements, and weather sources
  - name: Reports & Events
    description: Event logs, station runtimes, and water consumption history
  - name: Groups
    description: Controller groups and item management
  - name: User & Company
    description: User profiles, notification tokens, company sharing, and culture settings
  - name: IoT & LoRa
    description: IoT gateway management and LoRaWAN device provisioning
  - name: Authentication & OAuth
    description: OpenID Connect / OAuth 2.0 authorization, token exchange, and refresh services

paths:
  # Satellites
  /Satellite/GetSatelliteList:
    $ref: './paths/satellites.yaml#/~1Satellite~1GetSatelliteList'
  /Satellite/GetSatellite:
