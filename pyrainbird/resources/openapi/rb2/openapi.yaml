  /Satellite/{satelliteId}/StationAddresses:
    $ref: './paths/satellites.yaml#/~1Satellite~1{satelliteId}~1StationAddresses'
  /Satellite/{satelliteId}/StationAddresses/{stationId}:
    $ref: './paths/satellites.yaml#/~1Satellite~1{satelliteId}~1StationAddresses~1{stationId}'

  # Stations
  /Station/GetStationListForSatellite:
    $ref: './paths/stations.yaml#/~1Station~1GetStationListForSatellite'
  /Station/GetMasterValves:
