---
# pyrainbird/resources/openapi/rb2/schemas/programs.yaml
ProgramListResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
      description: Program letter or name (e.g. A, B, C, D).
    shortName:
      type: string
      description: Short program identifier (e.g. PGM A).
    satelliteId:
      type: integer
      format: int64
    number:
      type: integer
      description: Program number index.
    isEnabled:
      type: boolean
    type:
      type: integer
      description: Scheduling mode (0=Custom days of week, 2=Odd, 3=Odd31st, 4=Even, 5=Cyclic).
    weekDays:
      type: string
      description: 7-character bitstring of active days of week (bit 0=Sun .. bit 6=Sat).
    hybridWeekDays:
      type: string
      description: 7-character bitstring of permanent days off.
    skipDays:
      type: integer
      description: Interval days for cyclic scheduling.
    daysRemaining:
      type: integer
      description: Days remaining until next cyclic run.
    programAdjust:
      type: integer
      description: Seasonal adjustment percentage (0 to 300).
    etAdjustType:
      type: integer
      description: Evapotranspiration weather adjust mode.
    applySeasonalAdjustByMonth:
      type: boolean

ProgramResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    satelliteId:
      type: integer
      format: int64
    number:
      type: integer
    isEnabled:
      type: boolean
    type:
      type: integer
      description: Scheduling mode (0=Custom days of week, 2=Odd, 3=Odd31st, 4=Even, 5=Cyclic).
    weekDays:
      type: string
      description: 7-character bitstring of active days of week (bit 0=Sun .. bit 6=Sat).
    hybridWeekDays:
      type: string
    skipDays:
      type: integer
    daysRemaining:
      type: integer
    programAdjust:
      type: integer
    useProgramAdjust:
      type: boolean
    applySeasonalAdjustByMonth:
      type: boolean
    etAdjustType:
      type: integer
    startTime:
      type: array
      items:
        $ref: "#/StartTimeResponse"

StationProgramResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    programId:
      type: integer
      format: int64
    stationId:
      type: integer
      format: int64
    runTime:
      type: integer
      description: Station runtime in seconds.
    stepOrder:
      type: integer
      description: Execution sequence order.

ProgramStepRequest:
  type: object
  required:
    - programId
    - stationId
    - runTime
  properties:
    programId:
      type: integer
      format: int64
    stationId:
      type: integer
      format: int64
    runTime:
      type: integer
      description: Station runtime in seconds.
    stepOrder:
      type: integer

StartTimeResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    programId:
      type: integer
      format: int64
    startTimeIndex:
      type: integer
      description: Start time slot index (0 to 5 for slots 1-6).
    startTime:
      type: string
      description: Start time in HH:MM:SS or ISO-8601 format.
    isEnabled:
      type: boolean

AdvanceStationProgramRequest:
  type: object
  required:
    - stationId
  properties:
    programId:
      type: integer
      format: int64
      default: -1
    stationId:
      type: integer
      format: int64
